<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<title>Building the Future of Talent | Master Electronics</title>
<link rel="icon" href="assets/icons/favicon.svg">
<link rel="stylesheet" href="style.css?v=3.4">
<link rel="stylesheet" href="stage.css?v=3.4">
</head>
<body>

<!-- ============================================= spatial canvas -->
<div class="viewport" id="viewport">
  <div class="world" id="world"></div>
</div>

<!-- ============================================= top chrome -->
<header class="chrome" id="chrome">
  <div class="mark">
    <img src="assets/images/mark.svg" alt="" width="21" height="21">
    <div>
      <b>Building the Future of Talent</b>
      <span>Master Electronics &middot; Business Enablement</span>
    </div>
  </div>
  <span class="tag-int">INTERNAL</span>

  <nav class="prog" id="prog" aria-label="Section progress"></nav>

  <div class="chrome-r">
    <button class="tmr" id="clock" type="button" title="Session clock">0:00</button>
    <button class="ico" id="mapBtn" type="button" title="Journey map (M)" aria-label="Journey map">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
           stroke-linecap="round" stroke-linejoin="round"><path d="M3 7l6-3 6 3 6-3v13l-6 3-6-3-6 3z"/>
        <path d="M9 4v13M15 7v13"/></svg>
    </button>
    <button class="ico" id="notesBtn" type="button" title="Presenter notes (N)"
            aria-label="Presenter notes">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
           stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h11l4 4v14H5z"/>
        <path d="M9 9h7M9 13h7M9 17h4"/></svg>
    </button>
    <button class="ico" id="facBtn" type="button" title="Facilitator mode (F)"
            aria-label="Facilitator mode">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
           stroke-linecap="round" stroke-linejoin="round"><path d="M3 20a7 7 0 0 1 14 0"/>
        <circle cx="10" cy="8" r="3.6"/><path d="M17.5 4.5l1.6 1.6M21 9h-2.2M19.1 12.9l-1.6-1.6"/></svg>
    </button>
  </div>
</header>

<!-- ============================================= bottom nav -->
<div class="nav" id="nav">
  <button class="go sub" id="backBtn" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
         stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    Back
  </button>

  <div class="cue hide" id="cue">
    <p class="ck">Talking point &middot; <span id="cueWho"></span></p>
    <div id="cueBody"></div>
  </div>

  <span class="navspace"></span>

  <button class="go" id="nextBtn" type="button">
    <span id="nextLbl">Continue</span>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
         stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
  </button>
</div>

<!-- ============================================= presenter drawer -->
<aside class="drawer" id="drawer" aria-label="Presenter notes">
  <div class="dr-top">
    <b>Presenter notes</b>
    <span class="dr-who" id="drWho"></span>
    <button class="dr-x" id="drX" type="button" aria-label="Close notes">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor"
           stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div class="dr-body" id="drBody"></div>
  <div class="dr-foot">
    <button class="go sub" id="drBack" type="button">Back</button>
    <button class="go" id="drNext" type="button">Continue</button>
    <button class="go sub full" id="drMap" type="button">Open the journey map</button>
    <button class="go sub full" id="drReset" type="button">Clear captured responses</button>
  </div>
</aside>

<div class="hint" id="hint">Space or &rarr; to continue &middot; F for facilitator mode &middot;
  M for the journey map &middot; ? for all keys</div>
<div class="flash" id="flash" role="status" aria-live="polite"></div>

<script src="content-a.js?v=3.4"></script>
<script src="content-b.js?v=3.4"></script>
<script src="app.js?v=3.4"></script>
<script src="live.js?v=3.4"></script>
</body>
</html>
