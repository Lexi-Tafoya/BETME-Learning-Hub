<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0C1436">
<meta name="description" content="Building the Future of Talent — an introduction to Talent
  Management Reviews. Master Electronics, Business Enablement. Internal.">
<title>Building the Future of Talent | Master Electronics</title>
<link rel="icon" href="assets/icons/favicon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- the slides are built into here by script.js -->
<main id="stage" aria-label="Presentation"></main>

<!-- progress ticks: one per slide, clickable -->
<nav id="prog" class="prog" aria-label="Slide progress"></nav>

<!-- the only four controls that exist -->
<div class="controls" role="toolbar" aria-label="Presentation controls">
  <button id="home" type="button" class="ctl" title="First slide (Home)" aria-label="First slide">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M4 11.2 12 4.5l8 6.7"/><path d="M6.4 10v9.5h11.2V10"/></svg>
  </button>

  <button id="back" type="button" class="ctl" title="Back (&larr;)" aria-label="Previous slide">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M15 18.5 8.5 12 15 5.5"/></svg>
  </button>

  <span id="count" class="count" aria-live="polite">1 / 12</span>

  <button id="next" type="button" class="ctl pri" title="Next (&rarr; or Space)"
          aria-label="Next slide">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M9 5.5 15.5 12 9 18.5"/></svg>
  </button>

  <button id="full" type="button" class="ctl" title="Fullscreen (F)" aria-label="Fullscreen">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M4 9V4.5h4.5M20 9V4.5h-4.5M4 15v4.5h4.5M20 15v4.5h-4.5"/></svg>
  </button>
</div>

<script src="script.js"></script>
</body>
</html>
