# Render blueprint — TMR Learning Experience
# Master Electronics | INTERNAL
#
# One click from the GitHub repo: render.com -> New -> Blueprint -> pick the
# repo. Render reads this file and needs nothing else from you.
#
# There is no build step and no dependency to install, which is why this file is
# nine lines long. Node is the only requirement.
#
# After it deploys, the join QR at https://<service>.onrender.com/qr is already
# correct — the server draws it from the address the request arrived on, so
# there is nothing to regenerate and no PUBLIC_URL to set.
#
# Before running a real session on a public URL, read the two notes at the end
# of HOSTING.md: set FAC_KEY so the facilitator link is stable, and confirm the
# INTERNAL classification allows hosting outside the tenant.

services:
  - type: web
    name: tmr-learning-experience
    runtime: node
    plan: free
    buildCommand: ""
    startCommand: node server.js
    healthCheckPath: /healthz
