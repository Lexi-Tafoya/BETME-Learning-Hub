<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0C1436">
<title>Join &middot; TMR Session</title>
<link rel="icon" href="assets/icons/favicon.svg">
<style>
:root{
  --navy:#1F3899; --navy-900:#0C1436; --slate:#3D5D7D; --slate-4:#6E8FAE;
  --cream:#FCF3E7; --ink-2:rgba(252,243,231,.76); --ink-3:rgba(252,243,231,.55);
  --ink-4:rgba(252,243,231,.4); --edge:rgba(252,243,231,.15);
  --edge-2:rgba(252,243,231,.3); --ok:#6FCF9B; --warn:#F0C070;
  --sans:"Segoe UI Variable Text","Segoe UI",Aptos,system-ui,-apple-system,
         "SF Pro Text","Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"Cascadia Mono",SFMono-Regular,Consolas,monospace;
}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--navy-900); color:var(--cream); font:400 17px/1.55 var(--sans);
  min-height:100vh; min-height:100dvh; -webkit-font-smoothing:antialiased;
  background-image:
    radial-gradient(120% 60% at 20% -10%, rgba(31,56,153,.85) 0, transparent 60%),
    radial-gradient(100% 50% at 100% 100%, rgba(61,93,125,.5) 0, transparent 60%);
  background-attachment:fixed;
  padding:0 0 40px;
}
.bar{
  position:sticky; top:0; z-index:5; display:flex; align-items:center; gap:10px;
  padding:12px 18px calc(12px + env(safe-area-inset-top)); background:rgba(12,20,54,.9);
  backdrop-filter:blur(12px); border-bottom:1px solid var(--edge);
}
.bar img{width:19px;height:19px;flex:none}
.bar b{font-size:12.5px; font-weight:650; letter-spacing:.01em}
.bar .tag{
  font:700 8.5px/1 var(--sans); letter-spacing:.15em; color:#8AA4FF; margin-left:auto;
  border:1px solid rgba(138,164,255,.35); border-radius:99px; padding:3.5px 7px; flex:none;
}
.dot{width:8px;height:8px;border-radius:50%;background:var(--warn);flex:none}
.dot.on{background:var(--ok)}
.wrap{max-width:560px; margin:0 auto; padding:26px 20px 0}

h1{font:700 clamp(25px,7vw,34px)/1.14 var(--sans); letter-spacing:-.02em; margin:0 0 12px}
h2{font:670 20px/1.25 var(--sans); letter-spacing:-.01em; margin:0 0 10px}
p{margin:0 0 14px}
.eyebrow{font:700 11px/1 var(--sans); letter-spacing:.18em; text-transform:uppercase;
  color:var(--slate-4); margin:0 0 14px}
.lede{font-size:18px; color:var(--ink-2)}
.small{font-size:13.5px; color:var(--ink-3); line-height:1.5}
.card{background:rgba(252,243,231,.055); border:1px solid var(--edge); border-radius:18px;
  padding:20px}
.card.tint{background:linear-gradient(160deg,rgba(61,93,125,.45),rgba(61,93,125,.14))}
.rules{margin:16px 0 0; padding:0; list-style:none}
.rules li{position:relative; padding-left:20px; font-size:14px; color:var(--ink-2);
  margin:0 0 9px}
.rules li::before{content:"";position:absolute;left:3px;top:.6em;width:6px;height:6px;
  border-radius:50%;background:var(--ink-4)}
.rules b{color:var(--cream)}

/* waiting */
.wait{text-align:center; padding:52px 0}
.pulse{width:74px;height:74px;margin:0 auto 26px;position:relative}
.pulse span{position:absolute;inset:0;border-radius:50%;border:2px solid var(--slate-4);
  animation:pl 2.4s cubic-bezier(.2,.7,.3,1) infinite}
.pulse span:nth-child(2){animation-delay:1.2s}
.pulse i{position:absolute;inset:28px;border-radius:50%;background:var(--cream)}
@keyframes pl{0%{transform:scale(.4);opacity:.9}100%{transform:scale(1);opacity:0}}
.code{font:700 34px/1 var(--mono); letter-spacing:.2em; margin:6px 0 0}

/* activity */
.qnum{font:700 11px/1 var(--sans); letter-spacing:.16em; text-transform:uppercase;
  color:var(--slate-4); margin:0 0 10px}
.opts{display:grid; gap:11px; margin:0 0 22px}
.opt{
  display:flex; align-items:center; gap:14px; width:100%; text-align:left; cursor:pointer;
  border-radius:15px; border:1.5px solid var(--edge); background:rgba(252,243,231,.05);
  padding:16px 17px; min-height:60px; font:500 16.5px/1.4 var(--sans); color:var(--cream);
  transition:.14s ease; font-family:inherit;
}
.opt:active{transform:scale(.99)}
.opt .mk{flex:none; width:28px;height:28px;border-radius:50%;border:1.5px solid var(--edge-2);
  display:grid;place-items:center;font:700 13px/1 var(--mono); color:var(--ink-3)}
.opt.pick{border-color:var(--cream); background:rgba(252,243,231,.14)}
.opt.pick .mk{background:var(--cream); border-color:var(--cream); color:#101C4A}
.scale{display:flex; gap:9px; margin:0 0 6px}
.scale button{
  flex:1; min-height:66px; border-radius:14px; border:1.5px solid var(--edge);
  background:rgba(252,243,231,.05); color:var(--cream); cursor:pointer;
  display:grid; place-items:center; gap:2px; font-family:inherit; transition:.14s ease;
}
.scale button b{font:700 20px/1 var(--mono)}
.scale button span{font:600 9.5px/1 var(--sans); letter-spacing:.08em; text-transform:uppercase;
  color:var(--ink-4)}
.scale button.pick{background:var(--cream); border-color:var(--cream); color:#101C4A}
.scale button.pick span{color:rgba(16,28,74,.6)}
label.fld{display:block; font:650 14px/1.4 var(--sans); color:var(--ink-2); margin:0 0 7px}
textarea{
  width:100%; border-radius:14px; border:1.5px solid var(--edge);
  background:rgba(252,243,231,.05); color:var(--cream); padding:14px 15px;
  font:400 16px/1.5 var(--sans); min-height:96px; resize:vertical;
}
textarea:focus{outline:none; border-color:var(--edge-2); background:rgba(252,243,231,.09)}
.hint{font-size:12.5px; color:var(--ink-4); margin:0 0 9px}
.blk{margin:0 0 24px; padding:0 0 22px; border-bottom:1px solid var(--edge)}
.blk:last-of-type{border-bottom:0}
.ev{font-size:14.5px; color:var(--ink-2); margin:0 0 14px}

.sticky{
  position:sticky; bottom:0; padding:14px 20px calc(16px + env(safe-area-inset-bottom));
  background:linear-gradient(to top,var(--navy-900) 55%,transparent);
  max-width:560px; margin:0 auto;
}
.btn{
  width:100%; border:0; border-radius:99px; background:var(--cream); color:#101C4A;
  font:670 17px/1 var(--sans); padding:19px; min-height:58px; cursor:pointer;
  font-family:inherit; transition:.16s ease;
}
.btn:active{transform:scale(.99)}
.btn[disabled]{opacity:.4}
.btn.ghost{background:transparent;color:var(--ink-2);border:1px solid var(--edge)}

.done{text-align:center; padding:46px 0}
.tick{width:78px;height:78px;margin:0 auto 24px;border-radius:50%;background:var(--ok);
  display:grid;place-items:center;animation:pop .45s cubic-bezier(.2,.9,.3,1.2) both}
.tick svg{width:38px;height:38px;stroke:#0E2E1D;stroke-width:3;fill:none;
  stroke-linecap:round;stroke-linejoin:round}
@keyframes pop{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}

.banner{
  position:fixed; left:50%; bottom:22px; transform:translateX(-50%) translateY(160%);
  z-index:20; background:var(--cream); color:#101C4A; border-radius:12px; padding:13px 19px;
  font:600 14.5px/1.4 var(--sans); max-width:calc(100vw - 32px); text-align:center;
  box-shadow:0 14px 40px rgba(0,0,0,.5); transition:transform .3s cubic-bezier(.2,.8,.3,1);
}
.banner.up{transform:translateX(-50%) translateY(0)}
.hide{display:none !important}

/* ---- instructions, spelled out where the participant can actually read them ---- */
.howto-p{
  margin:0 0 22px; border:1px solid rgba(127,178,240,.3); border-radius:14px;
  background:rgba(127,178,240,.06); overflow:hidden;
}
.howto-p summary{
  cursor:pointer; list-style:none; padding:13px 16px; font:700 11px/1 var(--sans);
  letter-spacing:.15em; text-transform:uppercase; color:#BAD6F7;
}
.howto-p summary::-webkit-details-marker{display:none}
.howto-p summary::after{content:"  \25BE"; color:var(--ink-4)}
.howto-p[open] summary::after{content:"  \25B4"}
.howto-p dl{margin:0; padding:0 16px 14px}
.howto-p dt{
  font:700 10px/1 var(--sans); letter-spacing:.14em; text-transform:uppercase;
  color:var(--ink-4); margin:11px 0 4px;
}
.howto-p dd{margin:0; font-size:15px; line-height:1.5; color:var(--ink-2)}
.howto-p dd b, .howto-p dd strong{color:var(--cream)}

/* ---- one submission per pair ---- */
.pairbar{
  margin:0 0 18px; padding:14px 16px; border-radius:14px;
  border:1px solid rgba(240,192,112,.45); background:rgba(240,192,112,.09);
}
.pairbar b{display:block; font-size:16px; color:var(--warn); margin:0 0 5px}
.pairbar span{font-size:14.5px; line-height:1.5; color:var(--ink-2)}

/* ---- reference sections: nothing to submit ---- */
.refnote{
  margin:0 0 16px; padding:12px 15px; border-radius:12px; border:1px solid var(--edge);
  background:rgba(252,243,231,.035); font-size:14px; line-height:1.5; color:var(--ink-2);
}
.jorkey{
  margin:0 0 18px; padding:13px 16px; border-radius:13px;
  border:1px solid rgba(111,207,155,.45); background:rgba(111,207,155,.09);
}
.jorkey b{display:block; font:700 10px/1 var(--sans); letter-spacing:.15em;
  text-transform:uppercase; color:var(--ok); margin:0 0 6px}
.jorkey span{font-size:15px; line-height:1.5; color:var(--cream); font-weight:600}
.reflist{display:grid; gap:8px}
.refitem{border:1px solid var(--edge); border-radius:13px; background:rgba(252,243,231,.025);
  overflow:hidden}
.refitem.jor{border-color:rgba(111,207,155,.45); background:rgba(111,207,155,.055)}
.refitem summary{
  cursor:pointer; list-style:none; padding:14px 15px; display:flex; align-items:center; gap:10px;
  min-height:52px;
}
.refitem summary::-webkit-details-marker{display:none}
.refitem .rn{font:700 11px/1 var(--mono); color:var(--ink-4); flex:none; min-width:18px}
.refitem .rt{font:600 16px/1.35 var(--sans); flex:1}
.refitem .rb{
  flex:none; font:700 9px/1 var(--sans); letter-spacing:.12em; text-transform:uppercase;
  color:var(--ok); border:1px solid rgba(111,207,155,.5); border-radius:99px; padding:4px 7px;
}
.refitem .rbody{padding:0 15px 15px}
.refitem .rbody p{margin:0; font-size:15.5px; line-height:1.6; color:var(--ink-2)}
.refitem .rbody .rsm{margin:9px 0 0; font-size:14px; color:var(--ink-3)}
.refoot{margin:0; font-size:13.5px; line-height:1.5; color:var(--ink-3); text-align:center}

@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
</style>
</head>
<body>

<div class="bar">
  <img src="assets/images/mark.svg" alt="">
  <b>Building the Future of Talent</b>
  <span class="dot" id="dot" title="Connection"></span>
  <span class="tag">INTERNAL</span>
</div>

<main class="wrap" id="view"></main>
<div class="sticky" id="foot"></div>
<div class="banner" id="banner" role="status" aria-live="polite"></div>

<script src="content-a.js?v=3.4"></script>
<script src="content-b.js?v=3.4"></script>
<script src="join.js?v=3.4"></script>
</body>
</html>
